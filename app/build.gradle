plugins {
    id 'com.android.application'
}

// Optional: bake in the URL with  gradle assembleDebug -PvibesyncUrl=https://...
// Left empty, the app asks for the URL on first launch and remembers it.
def vibesyncUrl = (project.findProperty('vibesyncUrl') ?: '')
        .toString().trim().replace('\\', '').replace('"', '')
// The developer's own copy:  gradle assembleDebug -PvibesyncDev=true  (same app, has "Rate it", updates from 'apk-dev')
def vibesyncDev = (project.findProperty('vibesyncDev') ?: 'false').toString() == 'true'

android {
    namespace 'com.vibesync.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vibesync.app'
        minSdk 24
        targetSdk 34
        versionCode 43
        versionName '1.40'
        buildConfigField 'String', 'VIBESYNC_URL', "\"${vibesyncUrl}\""
        buildConfigField 'boolean', 'DEV', "${vibesyncDev}"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The signing key lives only in GitHub's Actions secrets (VS_KEYSTORE_B64 / VS_KEY_PASS), never in this repo.
    // CI decodes it to a temporary file and passes its path in VS_KEYSTORE. A local build without it uses
    // Gradle's own debug key (such an APK can't update the published app, which is the point).
    signingConfigs {
        debug {
            def ks = System.getenv("VS_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("VS_KEY_PASS")
                keyAlias 'vibesync'
                keyPassword System.getenv("VS_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // the same private key (from CI secrets)
        }
    }
}

// Google sign-in with Android's account picker (Credential Manager + Sign in with Google)
dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // On Android 13 and older, Google's sign-in screen (Play services) runs inside VibeSync and needs these;
    // without them it crashed (NoClassDefFoundError: androidx.core.app.ComponentActivity). Listed explicitly.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
}
