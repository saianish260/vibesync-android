name: Build VibeSync TV APK

on:
  push:
    branches: [tv]   # VibeSync TV only; the phone app builds from main
  workflow_dispatch:
    inputs:
      app_url:
        description: "VibeSync URL (empty = https://vibesync-saianish.streamlit.app/)"
        required: false
        default: ""
        type: string

permissions:
  contents: write   # lets the last step publish the APK to the 'apk-tv' branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the URL
        env:
          APP_URL: ${{ inputs.app_url || vars.VIBESYNC_URL || 'https://vibesync-saianish.streamlit.app/' }}
        run: |
          if [ -n "$APP_URL" ] && ! echo "$APP_URL" | grep -Eq '^https?://[^ "]+$'; then
            echo "::error::app_url must start with http:// or https:// and contain no spaces or quotes"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signing key (from GitHub secrets)
        env:
          VS_KEYSTORE_B64: ${{ secrets.VS_KEYSTORE_B64 }}
        run: |
          if [ -z "$VS_KEYSTORE_B64" ]; then
            echo "::error::Add the VS_KEYSTORE_B64 and VS_KEY_PASS secrets (Settings > Secrets and variables > Actions)"; exit 1
          fi
          echo "$VS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vs.jks"
          echo "VS_KEYSTORE=$RUNNER_TEMP/vs.jks" >> "$GITHUB_ENV"

      - name: Build APK (signed with the private key)
        env:
          VS_KEY_PASS: ${{ secrets.VS_KEY_PASS }}
          APP_URL: ${{ inputs.app_url || vars.VIBESYNC_URL || 'https://vibesync-saianish.streamlit.app/' }}
        run: gradle --no-daemon assembleDebug -PvibesyncUrl="$APP_URL"

      - name: Verify with aapt2 and apksigner
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/debug/app-debug.apk VibeSync-TV.apk
          "$BT/aapt2" dump badging VibeSync-TV.apk | tee badging.txt
          grep -q "package: name='com.vibesync.tv'" badging.txt
          grep -q "application-label:'VibeSync TV'" badging.txt
          grep -q "leanback-launchable-activity" badging.txt
          grep -q "minSdkVersion:'24'" badging.txt
          grep -q "targetSdkVersion:'34'" badging.txt
          PERMS=$(grep "^uses-permission" badging.txt || true)
          echo "Permissions: $PERMS"
          [ "$(echo "$PERMS" | grep -c .)" = "4" ] && echo "$PERMS" | grep -q "android.permission.INTERNET" \
            && echo "$PERMS" | grep -q "android.permission.POST_NOTIFICATIONS" && echo "$PERMS" | grep -q "android.permission.RECEIVE_BOOT_COMPLETED" \
            && echo "$PERMS" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"
          "$BT/apksigner" verify --print-certs VibeSync-TV.apk | tee -a badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VibeSync-TV-apk
          path: |
            VibeSync-TV.apk
            badging.txt

      - name: Publish APK to the 'apk-tv' branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp VibeSync-TV.apk badging.txt out/
          cd out
          git init -q -b apk-tv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "VibeSync-TV.apk built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-tv
