name: Build VibeSync APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: "VibeSync URL (empty = https://vibesync-saianish.streamlit.app/)"
        required: false
        default: ""
        type: string

permissions:
  contents: write   # lets the last step publish the APK to the 'apk' branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the URL
        env:
          APP_URL: ${{ inputs.app_url || vars.VIBESYNC_URL || 'https://vibesync-saianish.streamlit.app/' }}
        run: |
          if [ -n "$APP_URL" ] && ! echo "$APP_URL" | grep -Eq '^https?://[^ "]+$'; then
            echo "::error::app_url must start with http:// or https:// and contain no spaces or quotes"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signing key (from GitHub secrets)
        env:
          VS_KEYSTORE_B64: ${{ secrets.VS_KEYSTORE_B64 }}
        run: |
          if [ -z "$VS_KEYSTORE_B64" ]; then
            echo "::error::Add the VS_KEYSTORE_B64 and VS_KEY_PASS secrets (Settings > Secrets and variables > Actions)"; exit 1
          fi
          echo "$VS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vs.jks"
          echo "VS_KEYSTORE=$RUNNER_TEMP/vs.jks" >> "$GITHUB_ENV"

      - name: Build APK (signed with the private key)
        env:
          VS_KEY_PASS: ${{ secrets.VS_KEY_PASS }}
          APP_URL: ${{ inputs.app_url || vars.VIBESYNC_URL || 'https://vibesync-saianish.streamlit.app/' }}
        run: gradle --no-daemon assembleDebug -PvibesyncUrl="$APP_URL"

      - name: Check Google sign-in's libraries are inside the APK
        run: |
          gradle --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath | grep -E "androidx\.(core:core|activity:activity|fragment:fragment)[:]" | head -8
          python3 - <<'PY'
          import struct, zipfile
          z = zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk"); found = set()
          for n in z.namelist():
              if not (n.startswith("classes") and n.endswith(".dex")): continue
              d = z.read(n); so, to = struct.unpack_from("<I", d, 0x3C)[0], struct.unpack_from("<I", d, 0x44)[0]
              cs, co = struct.unpack_from("<II", d, 0x60)
              for k in range(cs):
                  t = struct.unpack_from("<I", d, co + 32 * k)[0]; s = struct.unpack_from("<I", d, so + 4 * struct.unpack_from("<I", d, to + 4 * t)[0])[0]
                  while d[s] & 0x80: s += 1
                  s += 1; found.add(d[s:d.index(b"\0", s)].decode("utf-8", "replace"))
          need = ["Landroidx/core/app/ComponentActivity;", "Landroidx/activity/ComponentActivity;", "Landroidx/fragment/app/FragmentActivity;"]
          miss = [c for c in need if c not in found]
          print("sign-in libraries:", "all inside" if not miss else "MISSING " + ", ".join(miss))
          raise SystemExit(1 if miss else 0)
          PY

      - name: Verify with aapt2 and apksigner
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/debug/app-debug.apk VibeSync.apk
          "$BT/aapt2" dump badging VibeSync.apk | tee badging.txt
          grep -q "package: name='com.vibesync.app'" badging.txt
          grep -q "application-label:'VibeSync'" badging.txt
          grep -q "minSdkVersion:'24'" badging.txt
          grep -q "targetSdkVersion:'34'" badging.txt
          PERMS=$(grep "^uses-permission" badging.txt || true)
          echo "Permissions: $PERMS"
          # androidx.core adds one app-internal permission (…DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION); the rest must be exactly these 4
          PERMS=$(echo "$PERMS" | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          [ "$(echo "$PERMS" | grep -c .)" = "4" ] && echo "$PERMS" | grep -q "android.permission.INTERNET" \
            && echo "$PERMS" | grep -q "android.permission.POST_NOTIFICATIONS" && echo "$PERMS" | grep -q "android.permission.RECEIVE_BOOT_COMPLETED" \
            && echo "$PERMS" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"
          "$BT/apksigner" verify --print-certs VibeSync.apk | tee -a badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VibeSync-apk
          path: |
            VibeSync.apk
            badging.txt

      - name: Publish APK to the 'apk' branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp VibeSync.apk badging.txt out/
          cd out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "VibeSync.apk built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      # ── the developer's own copy: same app and key, plus "Rate it"; updates from the 'apk-dev' branch ──
      - name: Build the developer's APK
        env:
          VS_KEY_PASS: ${{ secrets.VS_KEY_PASS }}
          APP_URL: ${{ inputs.app_url || vars.VIBESYNC_URL || 'https://vibesync-saianish.streamlit.app/' }}
        run: |
          gradle --no-daemon assembleDebug -PvibesyncUrl="$APP_URL" -PvibesyncDev=true
          grep -q "DEV = true" app/build/generated/source/buildConfig/debug/com/vibesync/app/BuildConfig.java
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir dev && cp app/build/outputs/apk/debug/app-debug.apk dev/VibeSync-Dev.apk
          "$BT/aapt2" dump badging dev/VibeSync-Dev.apk > dev/badging.txt
          grep -q "package: name='com.vibesync.app'" dev/badging.txt
          "$BT/apksigner" verify --print-certs dev/VibeSync-Dev.apk | tee -a dev/badging.txt
          cmp <(grep "certificate SHA-256" badging.txt) <(grep "certificate SHA-256" dev/badging.txt)
          head -1 dev/badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VibeSync-Dev-apk
          path: |
            dev/VibeSync-Dev.apk
            dev/badging.txt

      - name: Publish the developer's APK to the 'apk-dev' branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dev
          git init -q -b apk-dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "VibeSync-Dev.apk built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dev
